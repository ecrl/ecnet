name: Bug report
description: Report incorrect behavior or a crash in ECNet
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for a clear report. For security issues, email the maintainer
        instead of opening a public issue (see `SECURITY.md`).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands that trigger the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ECNet version
      placeholder: e.g. 4.1.4
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.7
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 22.04, macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste relevant traceback or logs.
      render: text
