[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["databases*", "paper*"]

[tool.setuptools.package-data]
"ecnet" = ["**/*.smiles", "**/*.target"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: requires external services, licensed tools, or large data",
    "slow: long-running tests; may be deselected in fast local runs",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # legacy long lines; tighten gradually
]

[tool.ruff.lint.per-file-ignores]
# Re-export modules intentionally import public names for package surface.
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "ecnet"
version = "4.1.5"
authors = [
    { name="Travis Kessler", email="travis.j.kessler@gmail.com" },
]
description = "Fuel property prediction using QSPR descriptors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0,<2.6",
    "scikit-learn>=1.5.1,<2",
    "padelpy>=0.1.16,<0.2",
    "alvadescpy>=0.1.3,<0.2",
    "ecabc>=3.0.1,<4",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "pre-commit>=4",
    "build>=1.2",
    "pip-audit>=2.7",
]
docs = [
    "sphinx>=7",
    "furo>=2024.8",
    "sphinx-autodoc-typehints>=2",
    "sphinx-copybutton>=0.5",
    "myst-parser>=3",
]

[project.urls]
"Homepage" = "https://github.com/ecrl/ecnet"
"Bug Tracker" = "https://github.com/ecrl/ecnet/issues"
